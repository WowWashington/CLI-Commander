name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install application dependencies
        run: python -m pip install -r requirements.lock
      - name: Isolate test data from the runner account
        run: |
          echo "BLADES_HOME=$RUNNER_TEMP/cli-blades-unit-state" >> "$GITHUB_ENV"
          echo "BLADES_PROJECTS_MD=$RUNNER_TEMP/cli-blades-no-project-index.md" >> "$GITHUB_ENV"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: node --check blades/static/app.js
      - name: Install isolated integration-test prerequisite
        run: brew install tmux
      - name: Real tmux and WebSocket integration with a fake provider
        env:
          BLADES_INTEGRATION: "1"
        run: python -m unittest discover -s tests -p test_integration.py -v

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24.11"
          cache: false
      - name: Install pinned scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan reachable Git history without printing secrets
        run: gitleaks git --log-opts="--all --full-history" --redact=100 --no-banner .
